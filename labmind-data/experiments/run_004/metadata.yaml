run_id: run_004
hypothesis: KDP crystals grown at 35°C with conservative 0.8°C/hour cooling can achieve
  target purity over a long stable run — testing whether extending duration to 10
  hours improves crystal size without introducing new failure modes.
context: 'Long-duration test at a safe cooling rate. The run was meant to be uneventful
  — slow cooling, plenty of margin, full 10 hours for crystal growth. Result: failure
  mode revealed an entirely different issue from any prior run. The pH probe drifted
  monotonically upward from 7.1 to 7.5 over 6 hours without ever crossing a warning
  threshold. By the time the probe finally read 7.6 (critical_above), the underlying
  solution chemistry had already shifted enough to cause KDP hydrolysis, which is
  irreversible.'
experiment_type: crystallization
duration_hours: 10
instruments:
- temp_controller
- ph_probe
- microscopy_imager
parameters:
  target_temp_c: 35.0
  cooling_rate_c_per_hour: 0.8
  growth_duration_hours: 10
  substrate: KDP
  solvent: deionized_water
  initial_concentration_g_per_L: 240.0
stages:
- name: equilibration
  hours: 0-2
  description: Hold at 35°C. Impurity readings up to 25 ppm during this phase are
    normal.
- name: nucleation
  hours: 2-6
  description: Slow 0.8°C/hour cooling. Conservative parameters chosen for long-duration
    stability.
- name: growth
  hours: 6-10
  description: Extended growth phase. Monitor for any slow-developing chemistry shifts
    that wouldn't manifest in a shorter run.
monitoring:
  temperature_c:
    target: 35.0
    warning_above: 37.0
    critical_above: 38.0
    warning_below: 33.0
    critical_below: 31.0
    concern: Conservative cooling rate gives ample thermal margin. Temperature should
      be uneventful throughout. If temperature does excursion, the cooling system
      is at fault — not the cooling rate.
  impurity_ppm:
    target: 15.0
    warning_above: 35.0
    critical_above: 50.0
    concern: Impurity should remain low at this cooling rate. A slow climb correlated
      with rising pH indicates chemical degradation, not thermal stress — different
      intervention required (buffer addition, not setpoint change).
  ph:
    target: 7.1
    warning_above: 7.4
    critical_above: 7.6
    warning_below: 6.8
    critical_below: 6.5
    concern: pH drift over long runs is the dominant chemistry failure mode. A SLOW
      MONOTONIC RISE matters more than a single threshold crossing — if pH has moved
      in one direction for 4+ hours, intervene early even if no warning is triggered.
      Standard probe drift is ~0.05/hour; rates faster than this indicate solution
      chemistry changes, not instrument drift.
remediation:
  ph_high:
    instrument: ph_probe
    action: add_buffer
    start_volume_ml: 5.0
    note: Add buffer in 5ml increments, wait 60s, re-read. Above 7.5, KDP hydrolyzes
      irreversibly — do not wait for the critical threshold if a slow drift has been
      underway for 4+ hours.
  ph_drift_pattern:
    instrument: ph_probe
    action: add_buffer_preemptive
    start_volume_ml: 3.0
    note: If pH has risen monotonically by >0.3 over any 4-hour window, intervene
      with a small (3ml) buffer addition even if no threshold has been crossed. Trend
      matters more than absolute value.
success_criteria:
- metric: crystal_clarity_pct
  target: '>= 90'
- metric: final_impurity_ppm
  target: < 30
- metric: ph_drift_total
  target: < 0.3 across entire run
- metric: critical_excursions
  target: '0'
known_risks:
- Long-duration runs expose slow-developing chemistry shifts that short runs hide.
  pH probe drift accumulates over hours — by hour 6 a monotonic upward trend can have
  moved pH from 7.1 to 7.5 without ever tripping a threshold check.
- KDP hydrolyzes irreversibly above pH 7.5. Once hydrolysis begins, the run cannot
  be recovered — even if pH is brought back down, the dissolved hydrolysis products
  contaminate the remaining solution.
- Slow drifts evade threshold-based monitoring. A pH reading of 7.4 (warning) for
  ten consecutive readings looks the same as a single 7.4 reading, but the first case
  means the solution is approaching irreversibility while the second is probably probe
  noise.
- Buffer additions are reversible (you can always add more) — preemptive small additions
  when a drift is detected are cheap insurance. Waiting for the critical threshold
  to fire risks crossing into hydrolysis territory before the agent has time to react.
start_time: '2026-05-14T22:00:00Z'
end_time: '2026-05-15T08:12:00Z'
status: completed
outcome: partial_failure
key_findings:
- pH drifted monotonically from 7.1 to 7.5 over 6 hours (rate ~0.067/hour) without
  ever crossing the 7.4 warning threshold on any individual reading — the trend was
  the entire signal, not any single value
- When pH finally read 7.6 (critical_above) at hour 6:30, partial KDP hydrolysis had
  already begun based on dissolved phosphate detection — by then the run was unrecoverable
- Buffer addition at hour 6:35 (5ml then 3ml) brought pH back to 7.3 by hour 7:30,
  but the hydrolysis products remained in solution, contaminating the final crystal
  growth phase
- Crystal clarity dropped to 81% — below the 90% target — entirely due to chemistry
  damage, not thermal damage. Temperature stayed within ±0.2°C of setpoint the entire
  run
- 'Recommendation for any run lasting more than 6 hours: monitor pH rate-of-change
  over rolling 4-hour windows, not just instantaneous thresholds. A drift of >0.3
  units in 4 hours warrants a preemptive 3ml buffer addition regardless of whether
  any single reading has tripped a warning'
