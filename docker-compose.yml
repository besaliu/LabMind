services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./labmind-data:/labmind-data
      - ./instruments:/instruments
    environment:
      - LABMIND_DATA=/labmind-data
      - CATALOG_DIR=/instruments/catalog
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp:
    build: ./mcp_server
    ports:
      - "8001:8001"
    volumes:
      - ./labmind-data:/labmind-data
      - ./instruments:/instruments
    environment:
      - LABMIND_DATA=/labmind-data
      - CATALOG_DIR=/instruments/catalog
      - BACKEND_URL=http://backend:8000
      - MCP_PORT=8001
    depends_on:
      backend:
        condition: service_healthy

  vix-temp-controller:
    build: ./vix
    command: python temp_controller.py --port 8101
    ports:
      - "8101:8101"
    environment:
      - BACKEND_URL=http://backend:8000
      - VIX_INTERVAL_SECONDS=30
      - SCENARIO=baseline
    depends_on:
      backend:
        condition: service_healthy

  vix-ph-probe:
    build: ./vix
    command: python ph_probe.py --port 8102
    ports:
      - "8102:8102"
    environment:
      - BACKEND_URL=http://backend:8000
      - VIX_INTERVAL_SECONDS=30
      - SCENARIO=baseline
    depends_on:
      backend:
        condition: service_healthy

  vix-microscopy-imager:
    build: ./vix
    command: python microscopy_imager.py --port 8103
    ports:
      - "8103:8103"
    environment:
      - BACKEND_URL=http://backend:8000
      - VIX_INTERVAL_SECONDS=60
      - SCENARIO=baseline
    depends_on:
      backend:
        condition: service_healthy

  vix-conductivity-probe:
    build: ./vix
    command: python conductivity_probe.py --port 8104
    ports:
      - "8104:8104"
    environment:
      - BACKEND_URL=http://backend:8000
      - VIX_INTERVAL_SECONDS=30
      - SCENARIO=baseline
    depends_on:
      backend:
        condition: service_healthy
