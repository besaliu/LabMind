[project]
name = "labmind-rag"
version = "0.1.0"
description = "LabMind RAG: experiment profile ingestion + similarity search over ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package lives directly in this directory (rag/ contains *.py, not rag/rag/*.py).
# Treat this dir as the `rag` package root.
packages = ["rag"]
package-dir = {"rag" = "."}
